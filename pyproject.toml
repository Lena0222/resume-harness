[project]
name = "resume-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
resume = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
